AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Mission Control — ArcSite project timeline board. One stack with everything it
  needs: network, HTTPS load balancer, the app on ECS Fargate, a private
  PostgreSQL database (RDS), secrets, logs, an image registry, and a role that
  GitHub Actions uses to deploy new versions.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label: { default: Website }
        Parameters: [DomainName, CertificateArn, AllowedCidr]
      - Label: { default: Google Workspace sign-in }
        Parameters: [GoogleClientId, GoogleClientSecret, AllowedDomains, AdminEmails]
      - Label: { default: App and database size }
        Parameters: [DesiredCount, TaskCpu, TaskMemory, DbInstanceClass, DbMultiAz]
      - Label: { default: Deploys from GitHub }
        Parameters: [GitHubRepo, CreateGitHubOidcProvider]
      - Label: { default: Jira import (optional) }
        Parameters: [JiraBaseUrl, JiraEmail, JiraApiToken, JiraStartDateField]

Parameters:
  DomainName:
    Type: String
    Description: Address people will open, e.g. mission.arcsite.com
  CertificateArn:
    Type: String
    Description: ARN of an ACM certificate for DomainName, in this same region.
  AllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Who can reach the site at the network level. Sign-in is always required; narrow this to an office/VPN range for extra protection.
  GoogleClientId:
    Type: String
    Description: OAuth client ID (Google Cloud Console → Credentials → Web application).
  GoogleClientSecret:
    Type: String
    NoEcho: true
    Description: OAuth client secret for the client above.
  AllowedDomains:
    Type: String
    Default: arcsite.com
    Description: Comma-separated Google Workspace domains allowed to sign in.
  AdminEmails:
    Type: String
    Description: Comma-separated emails that become admins when they sign in.
  DesiredCount:
    Type: Number
    Default: 0
    MinValue: 0
    MaxValue: 4
    Description: Number of app containers. Keep 0 until the first image has been pushed, then set to 1 (or 2 for extra resilience).
  TaskCpu:
    Type: String
    Default: '512'
    AllowedValues: ['256', '512', '1024']
  TaskMemory:
    Type: String
    Default: '1024'
    AllowedValues: ['512', '1024', '2048']
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro
    AllowedValues: [db.t4g.micro, db.t4g.small, db.t4g.medium]
  DbMultiAz:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Standby database in a second zone (roughly doubles database cost).
  GitHubRepo:
    Type: String
    Description: GitHub repository allowed to deploy, as owner/name.
  CreateGitHubOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Set to false if this AWS account already has the token.actions.githubusercontent.com identity provider.
  JiraBaseUrl:
    Type: String
    Default: ''
    Description: e.g. https://arcsite.atlassian.net — leave empty to disable Jira import.
  JiraEmail:
    Type: String
    Default: ''
  JiraApiToken:
    Type: String
    Default: not-configured
    NoEcho: true
  JiraStartDateField:
    Type: String
    Default: ''
    Description: Optional custom field id for a start date, e.g. customfield_10015.

Conditions:
  CreateOidc: !Equals [!Ref CreateGitHubOidcProvider, 'true']
  MultiAz: !Equals [!Ref DbMultiAz, 'true']

Resources:
  # ------------------------------------------------------------------ network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.40.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags: [{ Key: Name, Value: !Ref AWS::StackName }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }

  # Public subnets hold the load balancer and the app containers (which get a
  # public IP only to pull images; nothing can reach them except the load balancer).
  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.0.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public-a' }]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.1.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      MapPublicIpOnLaunch: false
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-public-b' }]
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable }
  PublicSubnetBRoutes:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable }

  # Private subnets (no internet route) hold the database.
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.10.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-private-a' }]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.40.11.0/24
      AvailabilityZone: !Select [1, !GetAZs '']
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-private-b' }]

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Mission Control load balancer
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: !Ref AllowedCidr }
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: !Ref AllowedCidr }
  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Mission Control app containers
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 8080, ToPort: 8080, SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup }
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Mission Control database
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroup }

  # ----------------------------------------------------------------- database
  DatabaseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Mission Control database login
      GenerateSecretString:
        SecretStringTemplate: '{"username": "mission_control"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  DatabaseSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Mission Control database subnets
      SubnetIds: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: '18'
      DBInstanceClass: !Ref DbInstanceClass
      DBName: mission_control
      MasterUsername: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${DatabaseSecret}:SecretString:password}}'
      AllocatedStorage: '20'
      MaxAllocatedStorage: 100
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: !If [MultiAz, true, false]
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DatabaseSubnetGroup
      VPCSecurityGroups: [!Ref DatabaseSecurityGroup]
      BackupRetentionPeriod: 14
      DeletionProtection: true
      AutoMinorVersionUpgrade: true
      CopyTagsToSnapshot: true

  # ------------------------------------------------------------- app secrets
  AppSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Mission Control third-party credentials
      SecretString: !Sub '{"GOOGLE_CLIENT_SECRET": "${GoogleClientSecret}", "JIRA_API_TOKEN": "${JiraApiToken}"}'

  # ---------------------------------------------------------------- registry
  Repository:
    Type: AWS::ECR::Repository
    Properties:
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules": [{"rulePriority": 1, "description": "Keep the 30 most recent images",
            "selection": {"tagStatus": "any", "countType": "imageCountMoreThan", "countNumber": 30},
            "action": {"type": "expire"}}]}

  # ------------------------------------------------------------ load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref LoadBalancerSecurityGroup]
      LoadBalancerAttributes:
        - { Key: idle_timeout.timeout_seconds, Value: '120' }
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      TargetType: ip
      Protocol: HTTP
      Port: 8080
      HealthCheckPath: /healthz
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      TargetGroupAttributes:
        - { Key: deregistration_delay.timeout_seconds, Value: '20' }

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref TargetGroup }]

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }

  # ---------------------------------------------------------------------- app
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterSettings: [{ Name: containerInsights, Value: enabled }]

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/ecs/${AWS::StackName}'
      RetentionInDays: 90

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns: [arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy]
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: [!Ref DatabaseSecret, !Ref AppSecret]

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Ref AWS::StackName
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      RuntimePlatform: { CpuArchitecture: X86_64, OperatingSystemFamily: LINUX }
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: app
          # GitHub Actions pushes each build as :<commit> and moves :prod to it.
          Image: !Sub '${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Repository}:prod'
          Essential: true
          PortMappings: [{ ContainerPort: 8080, Protocol: tcp }]
          StopTimeout: 30
          Environment:
            - { Name: NODE_ENV, Value: production }
            - { Name: PORT, Value: '8080' }
            - { Name: PUBLIC_URL, Value: !Sub 'https://${DomainName}' }
            - { Name: GOOGLE_CLIENT_ID, Value: !Ref GoogleClientId }
            - { Name: ALLOWED_DOMAINS, Value: !Ref AllowedDomains }
            - { Name: ADMIN_EMAILS, Value: !Ref AdminEmails }
            - { Name: PGHOST, Value: !GetAtt Database.Endpoint.Address }
            - { Name: PGPORT, Value: !GetAtt Database.Endpoint.Port }
            - { Name: PGDATABASE, Value: mission_control }
            - { Name: DB_SSL, Value: rds }
            - { Name: JIRA_BASE_URL, Value: !Ref JiraBaseUrl }
            - { Name: JIRA_EMAIL, Value: !Ref JiraEmail }
            - { Name: JIRA_START_DATE_FIELD, Value: !Ref JiraStartDateField }
          Secrets:
            - { Name: PGUSER, ValueFrom: !Sub '${DatabaseSecret}:username::' }
            - { Name: PGPASSWORD, ValueFrom: !Sub '${DatabaseSecret}:password::' }
            - { Name: GOOGLE_CLIENT_SECRET, ValueFrom: !Sub '${AppSecret}:GOOGLE_CLIENT_SECRET::' }
            - { Name: JIRA_API_TOKEN, ValueFrom: !Sub '${AppSecret}:JIRA_API_TOKEN::' }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app

  Service:
    Type: AWS::ECS::Service
    DependsOn: HttpsListener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      HealthCheckGracePeriodSeconds: 60
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200
        DeploymentCircuitBreaker: { Enable: true, Rollback: true }
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
          SecurityGroups: [!Ref AppSecurityGroup]
      LoadBalancers:
        - { ContainerName: app, ContainerPort: 8080, TargetGroupArn: !Ref TargetGroup }

  # ------------------------------------------------- deploys from GitHub Actions
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateOidc
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Assumed by GitHub Actions on the main branch to ship new versions.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepo}:ref:refs/heads/main'
      Policies:
        - PolicyName: push-and-roll-out
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt Repository.Arn
              - Effect: Allow
                Action: [ecs:UpdateService, ecs:DescribeServices]
                Resource: !Ref Service

Outputs:
  LoadBalancerDns:
    Description: Point DomainName here with a DNS CNAME (or Route 53 alias) record.
    Value: !GetAtt LoadBalancer.DNSName
  SiteUrl:
    Value: !Sub 'https://${DomainName}'
  GoogleRedirectUri:
    Description: Add this as an "Authorized redirect URI" on the Google OAuth client.
    Value: !Sub 'https://${DomainName}/auth/google/callback'
  EcrRepository:
    Description: GitHub variable ECR_REPOSITORY
    Value: !Ref Repository
  ClusterName:
    Description: GitHub variable ECS_CLUSTER
    Value: !Ref Cluster
  ServiceName:
    Description: GitHub variable ECS_SERVICE
    Value: !GetAtt Service.Name
  DeployRoleArn:
    Description: GitHub variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  LogGroup:
    Description: Where the app's logs go (CloudWatch Logs).
    Value: !Ref LogGroup
